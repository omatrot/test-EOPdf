<div class="text-center border-bottom p-3">
  <span class="fw-bold">dump-local-storage works!</span><br />
  <span>{{ params }}</span>
</div>

<div class="d-flex p-2">

  <div class="p-2 w-50">
    <ng-container *ngFor="let item of thelocalStorage; let idx = index; let isEven = even; let isLast = last">
      <div class="mb-1 text-word-wrap"><span>{{item.key}}</span>: <span><span>{{item.value}}</span></span></div>
    </ng-container>
  </div>

  <div class="p-2">

    <div *ngIf="isEOPdf">Called by EO Pdf object</div>
    <div *ngIf="!isEOPdf">Called by Browser</div>

    <div class="d-print-none text-center text-danger fw-bold">
      Screen mode
    </div>

    <div class="d-none d-print-block text-center text-danger fw-bold">
      Print mode
    </div>

    <div class="mt-3">
      <div>debug_env_params:</div>
      <div [innerHTML]="getDebugEnvParams"></div>
    </div>

  </div>

</div>
